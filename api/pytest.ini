[pytest]
testpaths = tests
markers =
    slow: runs a full 117-image analysis (deselect with -m "not slow")
filterwarnings =
    error::DeprecationWarning:bilharz.*
    # Starlette 1.x prefers httpx2 for its test client; httpx 0.28 still works.
    ignore:Using `httpx` with `starlette.testclient` is deprecated
